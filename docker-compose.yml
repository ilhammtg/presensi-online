services:
  # ─────────────────────────── DATABASE ───────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: presensi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-presensi_db}
      POSTGRES_USER: ${POSTGRES_USER:-presensi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-presensi_secret}
    ports:
      - "5434:5432"  # Host port 5434 (5432 & 5433 already in use)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-presensi_user} -d ${POSTGRES_DB:-presensi_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - presensi_net

  redis:
    image: redis:7-alpine
    container_name: presensi_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret} --appendonly yes
    ports:
      - "6399:6379"  # Host port 6399 (6379, 6380 already in use by other containers)
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - presensi_net

  # ─────────────────────────── DATABASE MIGRATIONS ────────────────
  migration:
    image: migrate/migrate:v4.18.2
    container_name: presensi_migration
    volumes:
      - ./backend/migrations:/migrations
    # Jalankan migrate up; auto-clean dirty state jika ada
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        DB_URL="postgres://${POSTGRES_USER:-presensi_user}:${POSTGRES_PASSWORD:-presensi_secret}@postgres:5432/${POSTGRES_DB:-presensi_db}?sslmode=disable"
        STATUS=$$(migrate -path=/migrations -database="$$DB_URL" version 2>&1 || true)
        if echo "$$STATUS" | grep -qi "dirty"; then
          VER=$$(echo "$$STATUS" | grep -o '[0-9]\+' | head -1)
          echo "Database is dirty at version $$VER, forcing version $$VER..."
          migrate -path=/migrations -database="$$DB_URL" force "$$VER" || true
        fi
        migrate -path=/migrations -database="$$DB_URL" up
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - presensi_net

  # ─────────────────────────── BACKEND SERVICES ───────────────────
  mock-campus-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: mock-campus-api
    container_name: presensi_mock_api
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      APP_PORT: "9001"
    ports:
      - "9001:9001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - presensi_net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: api
    container_name: presensi_api
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MOCK_CAMPUS_API_URL: http://mock-campus-api:9001
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:80,https://dashboard.nexgenbot.my.id,https://api.nexgenbot.my.id,https://presensi.nexgenbot.my.id,https://api.presensi.nexgenbot.my.id
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - presensi_net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: worker
    container_name: presensi_worker
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MOCK_CAMPUS_API_URL: http://mock-campus-api:9001
    depends_on:
      redis:
        condition: service_healthy
      mock-campus-api:
        condition: service_started
      migration:
        condition: service_completed_successfully
    networks:
      - presensi_net

  # ─────────────────────────── FRONTEND WEB DASHBOARD ──────────────
  web-dashboard:
    build:
      context: ./web-dashboard
      dockerfile: Dockerfile
    container_name: presensi_web_dashboard
    restart: unless-stopped
    ports:
      - "5173:80"
      - "3000:80"
    depends_on:
      - api
    networks:
      - presensi_net

networks:
  presensi_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
